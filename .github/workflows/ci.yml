name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Integration tests start PostgreSQL through Testcontainers; the runner's Docker is enough.
      - run: ./mvnw --batch-mode --no-transfer-progress verify
