name: smoke
on:
  push:
    branches: [work]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: docker compose up -d --wait --wait-timeout 240 && docker compose ps
      - run: |
          ./mvnw -B -q -DskipTests spring-boot:run > app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8080/actuator/health >/dev/null && break; sleep 2; done
          set -x
          curl -s localhost:8080/actuator/health; echo
          curl -s -o /dev/null -w "products %{http_code}\n" localhost:8080/api/v1/products
          curl -si -X POST localhost:8080/api/v1/orders -H 'Idempotency-Key: x' -H 'Content-Type: application/json' -d '{"items":[{"productId":1,"quantity":1}]}' | grep -iE "^HTTP|www-authenticate|\"code\""
          curl -s localhost:8080/.well-known/oauth-protected-resource; echo
          curl -s -o /dev/null -w "swagger %{http_code}\n" -L localhost:8080/swagger-ui.html
          curl -s localhost:8080/v3/api-docs | jq -c .components.securitySchemes
          curl -s "localhost:8180/realms/flash-sale/protocol/openid-connect/auth?client_id=flash-sale-swagger&response_type=code&redirect_uri=http%3A%2F%2Flocalhost%3A8080%2Fswagger-ui%2Foauth2-redirect.html&scope=openid&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256" | grep -oE "<title>[^<]*</title>|kc-form-login|Register"| sort -u
          curl -s -o /dev/null -w "no-pkce %{http_code}\n" "localhost:8180/realms/flash-sale/protocol/openid-connect/auth?client_id=flash-sale-swagger&response_type=code&redirect_uri=http%3A%2F%2Flocalhost%3A8080%2Fswagger-ui%2Foauth2-redirect.html&scope=openid"
          curl -s -X POST localhost:8180/realms/flash-sale/protocol/openid-connect/token -d grant_type=password -d client_id=flash-sale-swagger -d username=alice@flash-sale.local -d password=flash-sale-demo-2026; echo
          grep -iE "error|exception" app.log | head -5 || true
