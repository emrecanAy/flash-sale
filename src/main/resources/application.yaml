spring:
  application:
    name: flash-sale
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      # With virtual threads the servlet container no longer caps concurrency, the connection pool does.
      # A request that cannot get a connection within this window is rejected with 503 instead of queueing.
      maximum-pool-size: 20
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          # The Keycloak realm that signs access tokens. Its signing keys are fetched from the realm's
          # published JWKS on first use and refreshed when a token names a new key. There is no default:
          # without FLASHSALE_ISSUER_URI the service does not start.
          issuer-uri: ${FLASHSALE_ISSUER_URI}
          # Only tokens issued for this API are accepted, not any token the realm has signed.
          audiences: flash-sale-api

springdoc:
  swagger-ui:
    oauth:
      client-id: flash-sale-swagger
      use-pkce-with-authorization-code-grant: true
      scopes: openid

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

flashsale:
  reservation:
    # How long an unpaid order keeps its stock.
    ttl: 15m
    sweep-interval: 30s
    sweep-batch-size: 100
